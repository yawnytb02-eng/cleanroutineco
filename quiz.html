<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your Logbook | Clean Routine Co.</title>
<meta name="description" content="Two minutes, a few questions, one logbook that actually fits how you live.">
<meta name="theme-color" content="#3A2E24">
<link rel="canonical" href="https://yawnytb02-eng.github.io/cleanroutineco/quiz.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400&display=swap" rel="stylesheet">
<style>
/* ============================================
   RESET
   ============================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
img, svg { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: none; }
a { color: inherit; }

/* page transition */
body { opacity: 0; transition: opacity .4s ease; }
body.is-loaded { opacity: 1; }
body.is-leaving { opacity: 0; }
@media (prefers-reduced-motion: reduce) {
  body { transition: none; opacity: 1; }
}

/* ============================================
   TOKENS — copied from combine.html for visual consistency
   ============================================ */
:root {
  --grout:   #EEEAE3;
  --paper:   #F5EFE6;
  --card:    #FAF5EE;
  --ink:     #3A2E24;
  --ink-2:   #453A2E;
  --ink-soft:#7A6A5C;
  --line:    rgba(58,46,36,.14);
  --paper-soft: #B8A996;
  --line-on-ink: rgba(240,236,229,.16);

  --brass: #D4AF37;
  --brass-deep: #AD8B2C;

  --cg: #C2A48B;
  --cb: #8C7060;
  --hu: #D4AF37;
  --rg: #C99A8C;
  --rb: #6B7F5E;
  --sg: #A489B5;
  --sb: #7E96A6;

  --r-sm: 8px;
  --r-md: 16px;
  --r-lg: 28px;

  --shadow-1: 0 1px 2px rgba(58,46,36,.07), 0 10px 26px -12px rgba(58,46,36,.16);
  --shadow-2: 0 2px 4px rgba(58,46,36,.08), 0 20px 40px -16px rgba(58,46,36,.24);

  --serif: 'Cormorant Garamond', serif;
  --sans:  'DM Sans', sans-serif;
}

body {
  background: var(--grout); color: var(--ink); font-family: var(--sans);
  min-height: 100vh; display: flex; flex-direction: column;
}

.ic { width: 20px; height: 20px; flex-shrink: 0; }
.ic use, .ic path { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ============================================
   BACK LINK
   ============================================ */
.quiz-back-home {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 1.5rem 1.75rem; font-family: var(--serif); font-style: italic; font-size: 1.05rem;
  color: var(--ink); text-decoration: none;
}
.quiz-back-home:hover { opacity: .7; }

/* ============================================
   PAGE LAYOUT
   ============================================ */
.quiz-page {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 1.5rem 1.25rem 3rem;
}
.quiz-card {
  width: 100%; max-width: 480px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md);
  padding: 2.25rem 2rem; box-shadow: var(--shadow-2);
  opacity: 0; transform: translateY(14px);
  animation: quizCardIn .6s cubic-bezier(.22,.61,.36,1) .1s forwards;
}
@media (prefers-reduced-motion: reduce) {
  .quiz-card { opacity: 1; transform: none; animation: none; }
}
@keyframes quizCardIn { to { opacity: 1; transform: none; } }

.quiz-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.6rem; }
.quiz-kicker { font-family: var(--sans); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
.quiz-progress { font-family: var(--sans); font-size: 11px; color: var(--ink-soft); opacity: .8; }

/* ============================================
   STEPS + OPTIONS
   ============================================ */
.quiz-q { font-family: var(--serif); font-style: italic; font-size: 1.25rem; color: var(--ink); margin-bottom: 1.1rem; line-height: 1.4; }
.quiz-options { display: flex; flex-direction: column; gap: .55rem; }
.quiz-opt {
  display: block; width: 100%; text-align: left;
  font-family: var(--sans); font-size: 13.5px; color: var(--ink);
  padding: 13px 16px; border-radius: 10px; border: 1.5px solid var(--line);
  background: transparent; cursor: pointer;
  transition: border-color .25s, background .25s, color .25s;
}
.quiz-opt:hover { border-color: var(--brass-deep); }
.quiz-opt.is-active { background: var(--ink); color: var(--card); border-color: var(--ink); }
.quiz-back {
  display: inline-block; margin-top: .9rem; background: none; border: none; padding: 0; cursor: pointer;
  font-family: var(--sans); font-size: 11px; color: var(--ink-soft);
}
.quiz-back:hover { color: var(--ink); }

/* ============================================
   LOADING STATE
   ============================================ */
.quiz-loading { text-align: center; padding: 1.5rem 0; }
.quiz-loading-label {
  font-family: var(--serif); font-style: italic; font-size: 1.1rem; color: var(--ink);
  margin-bottom: 1.1rem;
}
.quiz-loading-bar { height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
.quiz-loading-bar span {
  display: block; height: 100%; width: 0%; background: var(--brass);
  animation: quizFill 1.2s ease forwards;
}
@keyframes quizFill { to { width: 100%; } }
@media (prefers-reduced-motion: reduce) {
  .quiz-loading-bar span { animation: none; width: 100%; }
}

/* ============================================
   RESULT
   ============================================ */
.quiz-result { border-left: 3px solid var(--acc, var(--brass)); padding-left: 1.1rem; }
.quiz-result-eyebrow {
  font-family: var(--sans); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-soft); margin-bottom: .6rem;
}
.quiz-result-headline {
  font-family: var(--serif); font-style: italic; font-size: 1.4rem; line-height: 1.35;
  color: var(--ink); margin-bottom: .6rem;
}
.quiz-result-name { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: .45rem; }
.quiz-result-desc { font-size: 13px; line-height: 1.65; color: var(--ink-soft); margin-bottom: 1.1rem; max-width: 42ch; }
.quiz-result-row { display: flex; align-items: center; gap: 16px; margin-bottom: 1.2rem; flex-wrap: wrap; }
.quiz-result-price { font-family: var(--serif); font-size: 1.2rem; color: var(--ink); }
.quiz-result-cta {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--sans); font-size: 13.5px; font-weight: 500; letter-spacing: .04em;
  color: var(--paper); background: var(--ink); padding: 12px 22px; border-radius: 999px;
  text-decoration: none; transition: transform .2s ease, box-shadow .2s ease, gap .2s ease;
}
.quiz-result-cta:hover { transform: translateY(-1px); box-shadow: var(--shadow-1); gap: 11px; }
.quiz-result-cta .ic { width: 14px; height: 14px; }

/* ============================================
   EMAIL CAPTURE
   ============================================ */
.quiz-capture-wrap { border-top: 1px solid var(--line); padding-top: 1.1rem; margin-bottom: 1rem; }
.quiz-capture-label { font-size: 12.5px; line-height: 1.6; color: var(--ink-soft); margin-bottom: .75rem; max-width: 40ch; }
.quiz-capture-row { display: flex; gap: .5rem; }
.quiz-capture-row input[type="email"] {
  flex: 1; min-width: 0; padding: 11px 14px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--paper); font-family: var(--sans); font-size: 13px; color: var(--ink);
}
.quiz-capture-row input[type="email"]::placeholder { color: var(--ink-soft); }
.quiz-capture-row input[type="email"]:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.quiz-capture-row button {
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--sans); font-size: 12.5px; font-weight: 400; letter-spacing: .06em;
  padding: 11px 18px; border-radius: var(--r-sm); background: var(--ink); color: var(--paper);
  white-space: nowrap; cursor: pointer; transition: transform .3s ease, box-shadow .3s ease;
}
.quiz-capture-row button:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
.quiz-capture-success { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink); }
.quiz-capture-success .ic { width: 16px; height: 16px; color: var(--brass-deep); flex-shrink: 0; }

.quiz-restart {
  background: none; border: none; padding: 0; cursor: pointer;
  font-family: var(--sans); font-size: 11px; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 2px;
}
.quiz-restart:hover { color: var(--ink); }

@media (max-width: 560px) {
  .quiz-card { padding: 1.85rem 1.4rem; }
  .quiz-q { font-size: 1.1rem; }
}
</style>
<noscript><style>body{opacity:1 !important;}</style></noscript>
</head>
<body>

<a href="combine.html" class="quiz-back-home">&larr; Clean Routine Co.</a>

<!-- ICON SPRITE -->
<svg style="display:none" aria-hidden="true">
  <symbol id="ic-check" viewBox="0 0 24 24"><path d="M4.5 12.5 9.5 17.5 19.5 6.5"/></symbol>
  <symbol id="ic-arrow-right" viewBox="0 0 24 24"><path d="M4 12h15.5"/><path d="M14 6.5 19.5 12 14 17.5"/></symbol>
</svg>

<main class="quiz-page">
  <div class="quiz-card" role="group" aria-label="Find your logbook quiz">
    <div class="quiz-top">
      <span class="quiz-kicker">Find your logbook</span>
      <span class="quiz-progress" id="quizProgress">Step 1 of 4</span>
    </div>

    <div class="quiz-step" id="quizStep1">
      <p class="quiz-q">Where do you feel most like yourself?</p>
      <div class="quiz-options" id="quizQ1">
        <button type="button" class="quiz-opt" data-lane="clean">Getting ready, taking your time</button>
        <button type="button" class="quiz-opt" data-lane="hustle">Somewhere with real numbers on a real screen</button>
        <button type="button" class="quiz-opt" data-lane="read">Mid-chapter, world blocked out</button>
        <button type="button" class="quiz-opt" data-lane="sober">A quiet, clear-headed morning</button>
      </div>
    </div>

    <div class="quiz-step" id="quizStep2" hidden>
      <p class="quiz-q">What&#8217;s more satisfying?</p>
      <div class="quiz-options" id="quizQ2">
        <button type="button" class="quiz-opt" data-lane="clean">A skincare routine that actually works</button>
        <button type="button" class="quiz-opt" data-lane="hustle">Watching a number move in the right direction</button>
        <button type="button" class="quiz-opt" data-lane="read">Finishing a book and immediately wanting to talk about it</button>
        <button type="button" class="quiz-opt" data-lane="sober">Waking up and remembering the whole night before</button>
      </div>
      <button type="button" class="quiz-back" data-back-to="1">&larr; back</button>
    </div>

    <div class="quiz-step" id="quizStep3" hidden>
      <p class="quiz-q">Which sounds more like you?</p>
      <div class="quiz-options" id="quizQ3"></div>
      <button type="button" class="quiz-back" data-back-to="2">&larr; back</button>
    </div>

    <div class="quiz-step" id="quizStep4" hidden>
      <p class="quiz-q">Who&#8217;s it for?</p>
      <div class="quiz-options" id="quizQ4">
        <button type="button" class="quiz-opt" data-who="girl">Her</button>
        <button type="button" class="quiz-opt" data-who="boy">Him</button>
      </div>
      <button type="button" class="quiz-back" data-back-to="3">&larr; back</button>
    </div>

    <div class="quiz-loading" id="quizLoading" hidden>
      <p class="quiz-loading-label">Finding your match&hellip;</p>
      <div class="quiz-loading-bar"><span></span></div>
    </div>

    <div class="quiz-result" id="quizResult" hidden>
      <p class="quiz-result-eyebrow">Your match</p>
      <h3 class="quiz-result-headline" id="quizResultHeadline"></h3>
      <p class="quiz-result-name" id="quizResultName"></p>
      <p class="quiz-result-desc" id="quizResultDesc"></p>
      <div class="quiz-result-row">
        <span class="quiz-result-price" id="quizResultPrice"></span>
        <a class="quiz-result-cta" id="quizResultCta" href="#">
          Get the logbook
          <svg class="ic" aria-hidden="true"><use href="#ic-arrow-right"/></svg>
        </a>
      </div>
      <div class="quiz-capture-wrap">
        <p class="quiz-capture-label" id="quizCaptureLabel"></p>
        <form class="quiz-capture-form" id="quizCaptureForm" action="https://formspree.io/f/mqevrejw" method="POST">
          <input type="hidden" name="source" value="quiz-page">
          <input type="hidden" name="product" id="quizCaptureProduct" value="">
          <div class="quiz-capture-row">
            <input type="email" name="email" placeholder="you@email.com" required aria-label="Email address">
            <button type="submit">Send it</button>
          </div>
        </form>
        <p class="quiz-capture-success" id="quizCaptureSuccess" hidden>
          <svg class="ic" aria-hidden="true"><use href="#ic-check"/></svg>
          Check your inbox &mdash; it&#8217;s on its way.
        </p>
      </div>
      <button type="button" class="quiz-restart" id="quizRestart">Start over</button>
    </div>
  </div>
</main>

<script>
(function () {
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* page transition */
  document.body.classList.add('is-loaded');
  document.querySelectorAll('a[href="combine.html"], a[href^="combine.html#"]').forEach(function (link) {
    link.addEventListener('click', function (e) {
      if (reduceMotion) return;
      var href = link.getAttribute('href');
      e.preventDefault();
      document.body.classList.remove('is-loaded');
      document.body.classList.add('is-leaving');
      window.setTimeout(function () { window.location.href = href; }, 380);
    });
  });

  /* product data — id, name, description (from combine.html landing copy), price, accent */
  var quizProducts = {
    'clean-girl':   { anchor: 'clean-girl',   name: 'Clean Girl Logbook',   desc: 'Track what you\u2019re using, how you\u2019re feeling, and what\u2019s working. Skincare, movement, food, sleep, laid out without fuss.', price: '$9',  accent: 'var(--cg)' },
    'clean-boy':    { anchor: 'clean-boy',    name: 'Clean Boy Logbook',    desc: 'Track your rotation, rate your fragrances, log your training. A grounded system for men who care about the details.', price: '$9', accent: 'var(--cb)' },
    'hustler':      { anchor: 'hustler',      name: 'Hustler\u2019s Logbook', desc: 'War room meets trading desk. Built for tracking income streams, trades, and the work, every day.', price: '$13', accent: 'var(--hu)' },
    'reading-girl': { anchor: 'reading-girl', name: 'Reading Girl Logbook', desc: 'A place to track your TBR, log every book, and make reading the softest part of your day.', price: '$9', accent: 'var(--rg)' },
    'reading-boy':  { anchor: 'reading-boy',  name: 'Reading Boy Logbook',  desc: 'Twenty pages a day, every day. Track what you read, what you took from it, and keep the habit honest.', price: '$9', accent: 'var(--rb)' },
    'sober-girl':   { anchor: 'sober-girl',   name: 'Sober Girl Logbook',   desc: 'A gentle daily record for the version of you that remembers the night before.', price: '$12', accent: 'var(--sg)' },
    'sober-boy':    { anchor: 'sober-boy',    name: 'Sober Boy Logbook',    desc: 'Clear-headed is a discipline too. Track the streak, respect the work, keep it honest.', price: '$12', accent: 'var(--sb)' }
  };

  var quizRouteMap = {
    clean: { girl: 'clean-girl', boy: 'clean-boy' },
    read:  { girl: 'reading-girl', boy: 'reading-boy' },
    sober: { girl: 'sober-girl', boy: 'sober-boy' }
  };

  var quizQ3Data = {
    clean: [
      { label: 'write it down before bed', headline: 'Some nights end with writing it down.' },
      { label: 'log it the second it happens', headline: 'You log it the second it happens.' }
    ],
    hustle: [
      { label: 'numbers first, feelings after', headline: 'Numbers first. Feelings after.' },
      { label: 'the story behind the numbers matters too', headline: 'The numbers matter. So does the story behind them.' }
    ],
    read: [
      { label: 'one book at a time, cover to cover', headline: 'One book at a time, start to finish.' },
      { label: 'always got three going at once', headline: 'Three books going at once, and that\u2019s fine.' }
    ],
    sober: [
      { label: 'quiet nights, one day at a time', headline: 'Quiet nights. One day at a time.' },
      { label: 'loud proof that it\u2019s working', headline: 'Proof it\u2019s working \u2014 right there in black and white.' }
    ]
  };

  var quizLane1 = null;
  var quizLane2 = null;
  var quizWinningLane = null;
  var quizHeadline = null;
  var quizWho = null;
  var quizProductId = null;

  var step1 = document.getElementById('quizStep1');
  var step2 = document.getElementById('quizStep2');
  var step3 = document.getElementById('quizStep3');
  var step4 = document.getElementById('quizStep4');
  var loadingEl = document.getElementById('quizLoading');
  var resultEl = document.getElementById('quizResult');
  var progressEl = document.getElementById('quizProgress');
  var q3Container = document.getElementById('quizQ3');

  function setProgress(n) { progressEl.textContent = 'Step ' + n + ' of 4'; }
  function resetActive(container) {
    container.querySelectorAll('.quiz-opt').forEach(function (o) { o.classList.remove('is-active'); });
  }
  function hideAllSteps() {
    step1.hidden = true; step2.hidden = true; step3.hidden = true; step4.hidden = true;
    loadingEl.hidden = true; resultEl.hidden = true;
  }

  /* Step 1 */
  document.querySelectorAll('#quizQ1 .quiz-opt').forEach(function (opt) {
    opt.addEventListener('click', function () {
      resetActive(document.getElementById('quizQ1'));
      opt.classList.add('is-active');
      quizLane1 = opt.getAttribute('data-lane');
      hideAllSteps();
      step2.hidden = false;
      setProgress(2);
    });
  });

  /* Step 2 — tally: matching picks confirm the lane; a mismatch is a 1-1 tie broken by Step 1, per spec */
  document.querySelectorAll('#quizQ2 .quiz-opt').forEach(function (opt) {
    opt.addEventListener('click', function () {
      resetActive(document.getElementById('quizQ2'));
      opt.classList.add('is-active');
      quizLane2 = opt.getAttribute('data-lane');
      quizWinningLane = quizLane1; // both the match case and the tie-break case resolve to Step 1's pick
      goToStep3();
    });
  });

  function goToStep3() {
    q3Container.innerHTML = '';
    var opts = quizQ3Data[quizWinningLane] || [];
    opts.forEach(function (opt) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'quiz-opt';
      btn.textContent = opt.label.charAt(0).toUpperCase() + opt.label.slice(1);
      btn.addEventListener('click', function () {
        resetActive(q3Container);
        btn.classList.add('is-active');
        quizHeadline = opt.headline;
        if (quizWinningLane === 'hustle') {
          quizProductId = 'hustler';
          runLoadingThenResult();
        } else {
          hideAllSteps();
          step4.hidden = false;
          setProgress(4);
        }
      });
      q3Container.appendChild(btn);
    });
    hideAllSteps();
    step3.hidden = false;
    setProgress(3);
  }

  /* Step 4 — skipped entirely for hustle */
  document.querySelectorAll('#quizQ4 .quiz-opt').forEach(function (opt) {
    opt.addEventListener('click', function () {
      resetActive(document.getElementById('quizQ4'));
      opt.classList.add('is-active');
      quizWho = opt.getAttribute('data-who');
      quizProductId = quizRouteMap[quizWinningLane][quizWho];
      runLoadingThenResult();
    });
  });

  function runLoadingThenResult() {
    hideAllSteps();
    loadingEl.hidden = false;
    progressEl.textContent = 'Almost there';
    var delay = reduceMotion ? 0 : 1200;
    window.setTimeout(showResult, delay);
  }

  function showResult() {
    var p = quizProducts[quizProductId];
    if (!p) return;
    document.getElementById('quizResultHeadline').textContent = quizHeadline;
    document.getElementById('quizResultName').textContent = p.name;
    document.getElementById('quizResultDesc').textContent = p.desc;
    document.getElementById('quizResultPrice').textContent = p.price;
    document.getElementById('quizResultCta').setAttribute('href', 'combine.html#' + p.anchor);
    document.getElementById('quizCaptureLabel').textContent = 'Want a free page from your ' + p.name + ' before you buy? We\u2019ll send it over.';
    document.getElementById('quizCaptureProduct').value = p.name;
    resultEl.style.setProperty('--acc', p.accent);
    hideAllSteps();
    resultEl.hidden = false;
  }

  /* back navigation */
  document.querySelectorAll('.quiz-back').forEach(function (b) {
    b.addEventListener('click', function () {
      var to = b.getAttribute('data-back-to');
      hideAllSteps();
      if (to === '1') { step1.hidden = false; setProgress(1); }
      else if (to === '2') { step2.hidden = false; setProgress(2); }
      else if (to === '3') { step3.hidden = false; setProgress(3); }
    });
  });

  /* start over */
  var restartBtn = document.getElementById('quizRestart');
  if (restartBtn) {
    restartBtn.addEventListener('click', function () {
      quizLane1 = null; quizLane2 = null; quizWinningLane = null;
      quizHeadline = null; quizWho = null; quizProductId = null;
      resetActive(document.getElementById('quizQ1'));
      resetActive(document.getElementById('quizQ2'));
      resetActive(document.getElementById('quizQ4'));
      hideAllSteps();
      step1.hidden = false;
      setProgress(1);
      var form = document.getElementById('quizCaptureForm');
      var success = document.getElementById('quizCaptureSuccess');
      if (form) { form.hidden = false; form.reset(); }
      if (success) success.hidden = true;
    });
  }

  /* email capture */
  var quizCaptureForm = document.getElementById('quizCaptureForm');
  if (quizCaptureForm) {
    quizCaptureForm.addEventListener('submit', function (e) {
      e.preventDefault();
      var submitBtn = quizCaptureForm.querySelector('button[type="submit"]');
      var originalLabel = submitBtn.textContent;
      submitBtn.textContent = 'Sending\u2026';
      submitBtn.disabled = true;
      fetch(quizCaptureForm.action, {
        method: 'POST',
        body: new FormData(quizCaptureForm),
        headers: { 'Accept': 'application/json' }
      }).then(function (res) {
        if (res.ok) {
          quizCaptureForm.hidden = true;
          document.getElementById('quizCaptureSuccess').hidden = false;
        } else {
          submitBtn.textContent = originalLabel;
          submitBtn.disabled = false;
        }
      }).catch(function () {
        submitBtn.textContent = originalLabel;
        submitBtn.disabled = false;
      });
    });
  }
})();
</script>
</body>
</html>
